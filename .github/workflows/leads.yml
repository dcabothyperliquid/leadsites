name: Find leads + build demo sites

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      only_city:
        description: "Only this city (e.g. Pune). Empty = config enabled_cities / all"
        required: false
        default: ""
      regen_pitches:
        description: "Rebuild pitch + WhatsApp links for all leads"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency: leads

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find leads
        env:
          ONLY_CITY: ${{ github.event.inputs.only_city }}
        run: python scripts/finder.py
      - name: Generate demo sites
        env:
          REGEN_PITCHES: ${{ github.event.inputs.regen_pitches }}
        run: python scripts/generate.py
      - name: Commit
        run: |
          git config user.name "leadsites-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -qm "leads: $(date -u +%F)"
          git pull --rebase -q || true
          git push
